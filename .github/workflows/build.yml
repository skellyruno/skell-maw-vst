name: Build Windows VST3
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

# Only PR builds are supersedable. Keep manual runs and main builds intact.
concurrency:
  group: skell-maw-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dsp_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure JUCE-free DSP regression tests
        run: cmake -S . -B build-dsp -DCMAKE_BUILD_TYPE=Release -DMAW_DSP_TESTS_ONLY=ON
      - name: Compile DSP tests
        run: cmake --build build-dsp --parallel 2
      - name: Run DSP tests
        run: ctest --test-dir build-dsp --output-on-failure

  build:
    needs: dsp_tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure Windows VST3 collection
        run: cmake -S . -B build -A x64
      - name: Build Windows VST3 collection
        run: cmake --build build --config Release --parallel 2
      - name: Test release package validator
        run: python -m unittest discover -s Tools/tests -v
      - name: Stage and validate Windows VST3 bundles
        run: python Tools/verify_vst3_package.py --source-dir build --package-dir package
      - name: Validate Dark Forest VST3 with pluginval
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: package/Dark Forest.vst3
          strictness-level: 5
          pluginval-version: v2.0.0-beta3
      - name: Validate Hypnosis VST3 with pluginval
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: package/Hypnosis.vst3
          strictness-level: 5
          pluginval-version: v2.0.0-beta3
      - name: Validate Serpents Maw VST3 with pluginval
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: package/Serpents Maw.vst3
          strictness-level: 5
          pluginval-version: v2.0.0-beta3
      - name: Validate Butterfly Delay VST3 with pluginval
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: package/Butterfly Delay.vst3
          strictness-level: 5
          pluginval-version: v2.0.0-beta3
      - name: Validate Shed Skin VST3 with pluginval
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: package/Shed Skin.vst3
          strictness-level: 5
          pluginval-version: v2.0.0-beta3
      - name: Validate Constrictor VST3 with pluginval
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: package/Constrictor.vst3
          strictness-level: 5
          pluginval-version: v2.0.0-beta3
      - name: Validate Night Bloom VST3 with pluginval
        uses: Tracktion/pluginval/validate@v2.0.0-beta3
        with:
          plugins: package/Night Bloom.vst3
          strictness-level: 5
          pluginval-version: v2.0.0-beta3
      - name: Upload verified preview package
        uses: actions/upload-artifact@v4
        with:
          name: SkellMaw-Windows-VST3
          path: package/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
