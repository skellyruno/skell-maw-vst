name: Build Windows VST3
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          $plugins = Get-ChildItem -Path build -Directory -Recurse -Filter '*.vst3'
          if (-not $plugins) { throw 'VST3 bundles missing' }
          foreach ($p in $plugins) { Copy-Item -Recurse $p.FullName package/ }
          Write-Host "Packaged VST3s:"
          Get-ChildItem package | ForEach-Object { Write-Host $_.Name }
          Compress-Archive -Path package/* -DestinationPath SkellMaw-VST3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SkellMaw-VST3
          path: SkellMaw-VST3.zip
          if-no-files-found: error
